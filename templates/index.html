<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Duplicate Finder - Limpia tu Playlist</title>
    
    <meta name="description" content="Herramienta gratuita para detectar y limpiar canciones duplicadas o repetidas en tus playlists de YouTube Music en segundos.">
    <meta name="keywords" content="youtube music, limpiar playlist, borrar canciones repetidas, duplicados, organizar musica, app gratis">
    <meta name="author" content="Carlos Josafat">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="YT Music Duplicate Finder">
    <meta property="og:description" content="Descubre qué canciones tienes repetidas en tu playlist de YouTube Music con un solo clic.">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="google-site-verification" content="rrQNYxtmefdZ1_lWWIwc78nUEC9c03Tf8gzVG5CFqFw" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans flex flex-col items-center justify-start p-4 sm:p-8">

    <div class="max-w-3xl w-full text-center my-8">
        <h1 class="text-4xl sm:text-5xl font-black tracking-tight bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
            Playlist Cleaner
        </h1>
        <p class="text-zinc-400 mt-2 text-sm sm:text-base">Detecta canciones repetidas en tus listas de YouTube Music al instante, gue.</p>
    </div>

    <div class="max-w-3xl w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl">
        <form id="form-analizar" class="flex flex-col sm:flex-row gap-3">
            <input 
                type="text" 
                id="url-input"
                name="url" 
                required
                placeholder="Pega la URL de tu playlist aquí..." 
                class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-cyan-500 transition-colors text-sm"
            >
            <button 
                type="submit" 
                class="bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-600 hover:to-cyan-700 text-zinc-950 font-bold px-6 py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/10 active:scale-95 text-sm"
            >
                Analizar Lista
            </button>
        </form>

        <div id="loader" class="hidden flex-col items-center justify-center my-12 animate-pulse">
            <div class="w-10 h-10 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
            <p class="text-zinc-500 text-xs mt-3 tracking-wider uppercase">Analizando metadatos...</p>
        </div>

        <div id="resultados" class="mt-8 hidden">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-4 mb-4">
                <span id="res-total" class="text-xs text-zinc-500 font-medium"></span>
                <span id="res-status" class="px-3 py-1 rounded-full text-xs font-bold"></span>
            </div>

            <div class="overflow-x-auto rounded-xl border border-zinc-800 bg-zinc-950/50">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-zinc-800 bg-zinc-900/50 text-xs text-zinc-400 uppercase tracking-wider">
                            <th class="p-4">Título</th>
                            <th class="p-4">Artista</th>
                            <th class="p-4 text-center">Veces</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="text-sm divide-y divide-zinc-900">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('form-analizar').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlInput = document.getElementById('url-input').value;
            const loader = document.getElementById('loader');
            const resultados = document.getElementById('resultados');
            const tablaCuerpo = document.getElementById('tabla-cuerpo');
            const resTotal = document.getElementById('res-total');
            const resStatus = document.getElementById('res-status');

            // Resetear interfaz
            loader.classList.remove('hidden');
            resultados.classList.add('hidden');
            tablaCuerpo.innerHTML = '';

            const formData = new FormData();
            formData.append('url', urlInput);

            try {
                const response = await fetch('/analizar', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loader.classList.add('hidden');

                if (!response.ok) {
                    alert(data.error || "Ocurrió un error inesperado.");
                    return;
                }

                resultados.classList.remove('hidden');
                resTotal.textContent = `Total analizado: ${data.total} canciones.`;

                if (data.duplicados.length === 0) {
                    resStatus.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400";
                    resStatus.textContent = "Playlist Limpia";
                    tablaCuerpo.innerHTML = `
                        <tr>
                            <td colspan="3" class="p-8 text-center text-zinc-500 italic">¡Felicidades, gue! No hay ninguna canción repetida.</td>
                        </tr>
                    `;
                } else {
                    resStatus.className = "px-3 py-1 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400";
                    resStatus.textContent = `${data.duplicados.length} Duplicados`;

                    data.duplicados.forEach(track => {
                        const fila = document.createElement('tr');
                        fila.className = "hover:bg-zinc-900/30 transition-colors";
                        fila.innerHTML = `
                            <td class="p-4 font-semibold text-zinc-200">${track.Título}</td>
                            <td class="p-4 text-zinc-400">${track.Artista}</td>
                            <td class="p-4 text-center font-bold text-cyan-400">${track.Repeticiones}</td>
                        `;
                        tablaCuerpo.appendChild(fila);
                    });
                }

            } catch (err) {
                loader.classList.add('hidden');
                alert("Error de conexión con el servidor backend.");
            }
        });
    </script>
</body>
</html>
